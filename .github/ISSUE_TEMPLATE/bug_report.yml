name: Bug report
description: Report a reproducible problem with AER PDF Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove confidential, personal, client and project information before sharing screenshots or PDFs."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include sample steps using nonconfidential test files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      placeholder: "1.4, or commit hash"
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or error details (sanitised)
      render: shell
