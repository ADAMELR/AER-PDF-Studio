name: Qt 2.0 Developer Preview Tests and Build

on:
  push:
    paths:
      - 'qt_app.py'
      - 'qt_model.py'
      - 'requirements-qt.txt'
      - 'tests/test_qt_smoke.py'
      - 'tests/test_qt_model.py'
      - '.github/workflows/qt-ci.yml'
      - 'pdf_operations.py'
      - 'compare_batch.py'
      - 'measurements.py'
      - 'takeoff.py'
      - 'vector_ocr.py'
      - 'arabic_ocr.py'
      - 'searchable_ocr.py'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-qt.txt
      - run: python -m compileall -q qt_app.py qt_model.py
      - run: python -m unittest discover -s tests -v

  windows-qt-build:
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-qt.txt pyinstaller
      - run: python -m PyInstaller --clean --onefile --windowed --name AER-PDF-Studio-Qt-Preview qt_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AER-PDF-Studio-Qt-Preview-Windows
          path: dist/AER-PDF-Studio-Qt-Preview.exe
          if-no-files-found: error
