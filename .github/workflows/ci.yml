name: Test and build AER PDF Studio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py pdf_operations.py viewer.py annotations.py measurements.py takeoff.py compare.py
      - run: python -m unittest discover -s tests -v
  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --clean --onefile --windowed --name AER-PDF-Studio app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AER-PDF-Studio-Windows
          path: dist/AER-PDF-Studio.exe
          if-no-files-found: error
